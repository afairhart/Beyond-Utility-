name: Deploy to Firebase

on:
  push:
    branches:
      - master
  # Pushes made by the auto-merge workflow use GITHUB_TOKEN, which GitHub
  # deliberately does not let trigger other workflows — so the push trigger
  # above never fires for auto-merged claude/** branches. The workflow_run
  # trigger below chains this deploy off the auto-merge completing instead,
  # and workflow_dispatch allows manual runs from the Actions tab or API.
  workflow_dispatch:
  workflow_run:
    workflows: ["Auto-merge Claude branches to master"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        run: cd functions && npm install

      - name: Deploy to Firebase
        run: firebase deploy --only hosting,functions,firestore:rules --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
