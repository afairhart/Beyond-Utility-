name: Deploy to Firebase

on:
  # Direct pushes to master, plus a manual "Run workflow" button. The
  # auto-merge workflow deploys inline after it merges a claude/** branch,
  # so this workflow is only needed for direct master pushes and manual runs.
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        run: cd functions && npm install

      - name: Deploy to Firebase
        run: firebase deploy --only hosting,functions,firestore:rules --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
