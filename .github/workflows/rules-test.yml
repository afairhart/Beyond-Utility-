name: Firestore rules test

on:
  push:
    branches:
      - master
      - 'claude/**'
  pull_request:
  workflow_dispatch:

jobs:
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java (Firestore emulator requires a JRE)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test dependencies
        run: cd test && npm ci

      - name: Run Firestore security-rules tests
        run: cd test && npm test
